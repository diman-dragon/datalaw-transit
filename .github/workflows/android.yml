name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (уже есть на раннере) — принять лицензии
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Тесты (импорт GTFS, расписание, поиск)
        run: npm test

      - name: Проверка типов
        run: npm run typecheck
        continue-on-error: true # не блокирует сборку; смотрите предупреждения в логе

      - name: Сборка веб-части
        run: npm run build

      - name: Android-проект (создаётся при первом запуске)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node scripts/prepare-android.mjs
          chmod +x android/gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Подпись APK (один и тот же ключ keystore/ при каждой сборке — приложение обновляется, а не ставится заново)
        env:
          KS_PASS: datalaw-transit
        run: |
          if [ ! -f keystore/datalaw-release.jks ]; then
            echo "::error::Нет файла keystore/datalaw-release.jks. Без него APK будет подписан другим ключом и не обновится поверх установленного."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks keystore/datalaw-release.jks --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" --out "DataLaw-Transit-$VERSION.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "DataLaw-Transit-$VERSION.apk" | tee cert.txt
          {
            echo "### Подпись APK"
            echo "Отпечаток ключа должен быть одинаковым во всех сборках:"
            grep "SHA-256" cert.txt | head -1
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_NAME=DataLaw-Transit-$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: DataLaw-Transit-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
